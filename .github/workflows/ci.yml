name: ROS2 Humble CI

on:
  push:
  pull_request:

jobs:
  build-test-and-acceptance:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ROS_DOMAIN_ID: 77
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-matplotlib python3-numpy \
            libeigen3-dev libgtest-dev
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build and test ROS2 workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Build core without ROS2
        shell: bash
        run: |
          cmake -S src/drone_core -B /tmp/drone_core_standalone \
            -DDRONE_CORE_STANDALONE=ON -DBUILD_TESTING=ON
          cmake --build /tmp/drone_core_standalone -j2
          ctest --test-dir /tmp/drone_core_standalone --output-on-failure

      - name: Run non-map acceptance scenarios
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch drone_bringup experiment.launch.py \
            scenario:=hover duration:=12.0 output_dir:=/tmp/acceptance/hover
          ros2 launch drone_bringup experiment.launch.py \
            scenario:=target duration:=16.0 output_dir:=/tmp/acceptance/target
          ros2 launch drone_bringup experiment.launch.py \
            scenario:=square duration:=20.0 output_dir:=/tmp/acceptance/square
          python3 scripts/verify_experiments.py --root /tmp/acceptance
