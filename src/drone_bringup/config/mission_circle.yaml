analytic_trajectory_node:
  ros__parameters:
    trajectory_type: circle
    trajectory_center: [0.0, 0.0, 1.5]
    trajectory_radius_x: 1.0
    trajectory_radius_y: 1.0
    trajectory_period: 8.0
    trajectory_start_delay: 2.0
    trajectory_preview_horizon: 8.0
    trajectory_face_velocity: true

position_controller_node:
  ros__parameters:
    auto_takeoff: false

experiment_recorder:
  ros__parameters:
    scenario: circle
    duration: 19.0
    output_dir: artifacts/experiments/circle
