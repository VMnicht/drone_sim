sensor_simulator_node:
  ros__parameters:
    sensor_noise_enabled: true
    position_noise_stddev: [0.03, 0.03, 0.05]
    velocity_noise_stddev: [0.05, 0.05, 0.08]
    accelerometer_noise_stddev: [0.08, 0.08, 0.10]
    gyroscope_noise_stddev: [0.005, 0.005, 0.008]
    accelerometer_initial_bias: [0.02, -0.01, 0.03]
    gyroscope_initial_bias: [0.002, -0.001, 0.001]

position_controller_node:
  ros__parameters:
    auto_takeoff: true

experiment_recorder:
  ros__parameters:
    scenario: sensor_noise
    duration: 14.0
    output_dir: artifacts/experiments/sensor_noise
