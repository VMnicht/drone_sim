position_controller_node:
  ros__parameters:
    # Shared rigid-body/actuator values are loaded from model.yaml.

    # Model-based position and geometric attitude controller.
    position_gain: [3.0, 3.0, 6.0]
    velocity_gain: [3.5, 3.5, 4.5]
    attitude_gain: [0.40, 0.40, 0.25]
    angular_rate_gain: [0.16, 0.16, 0.10]
    maximum_torque: [1.0, 1.0, 0.5]
    maximum_horizontal_acceleration: 3.0
    maximum_vertical_acceleration: 6.0
    maximum_tilt_degrees: 25.0
    maximum_thrust_to_weight: 2.5

    controller_frequency: 100.0
    odometry_timeout: 0.2
    # Once valid closed-loop operation has started, a short WSL scheduling gap
    # holds equal hover thrust instead of interpreting the gap as motor power-off.
    odometry_timeout_hover_enabled: true
    # Frames and topic names are centralized in interfaces.yaml.
    auto_takeoff: true
    takeoff_position: [0.0, 0.0, 1.5]
    takeoff_yaw: 0.0

    command_qos_depth: 20
    reference_qos_depth: 1
    odometry_qos_depth: 20
    goal_qos_depth: 10
    trajectory_qos_depth: 10

    minimum_quaternion_norm: 1.0e-9
    goal_change_position_tolerance: 1.0e-6
    goal_change_yaw_tolerance: 1.0e-6
    diagnostics_log_throttle_ms: 1000
