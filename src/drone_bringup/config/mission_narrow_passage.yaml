static_obstacle_map_node:
  ros__parameters:
    # Two walls leave a 1.6 m corridor centered on y=0.
    box_obstacles: [
      2.5,  1.45, 1.2, 4.2, 1.3, 2.4,
      2.5, -1.45, 1.2, 4.2, 1.3, 2.4,
      4.8,  0.00, 0.6, 0.5, 0.6, 1.2
    ]

waypoint_mission_node:
  ros__parameters:
    waypoints: [0.0, 0.0, 1.5, 0.0, 5.7, 0.0, 1.5, 0.0]
    arrival_tolerance: 0.18
    dwell_time: 0.8
    start_delay: 1.0
    goal_topic: /drone/raw_goal

position_controller_node:
  ros__parameters:
    auto_takeoff: false

experiment_recorder:
  ros__parameters:
    scenario: narrow_passage
    duration: 32.0
    output_dir: artifacts/experiments/narrow_passage
